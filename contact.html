    <main class="contact-container">
        <section class="contact-card">
            <h2>ارتباط با من</h2>
            <p>خوشحال می‌شوم نظراتتان را بشنوم. می‌توانید فرم زیر را پر کنید یا مستقیماً از طریق ایمیل در ارتباط باشید:</p>
            
            <div class="contact-links">
                <div class="contact-item">
                    <span class="contact-icon">📧</span>
                    <strong>ایمیل مستقیم:</strong> 
                    <a href="mailto:zahra.aghaee.1382@gmail.com">zahra.aghaee.1382@gmail.com</a>
                </div>
            </div>

            <form class="contact-form" id="p_form">
                <div class="form-group">
                    <label for="name">نام و نام خانوادگی:</label>
                    <input type="text" id="name" required placeholder="نام خود را وارد کنید...">
                </div>
                <div class="form-group">
                    <label for="email">ایمیل شما:</label>
                    <input type="email" id="email" required placeholder="ایمیل خود را وارد کنید...">
                </div>
                <div class="form-group">
                    <label for="message">پیام شما:</label>
                    <textarea id="message" rows="4" required placeholder="پیام خود را بنویسید..."></textarea>
                </div>
                <button type="submit" class="btn">ارسال پیام</button>
            </form>
        </section>
